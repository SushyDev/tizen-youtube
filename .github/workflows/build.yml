name: Build TizenTube

on:
  workflow_dispatch:
  push:
    branches:
      - fix-tizen-auto-launch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TizenTube
        run: npm run build

      - name: Test
        run: npm test

      - name: Package WGT
        run: npm run package

      - name: Upload WGT files
        uses: actions/upload-artifact@v4
        with:
          name: tizen-youtube-wgt
          path: release/*.wgt
          if-no-files-found: error
          retention-days: 7
