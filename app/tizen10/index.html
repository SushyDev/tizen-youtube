<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube for Tizen</title>
<style>
body { margin: 0; padding: 12vh 8vw; background: #0f0f0f; color: #f1f1f1; font: 2.4vw/1.45 system-ui, sans-serif; }
h1 { margin: 0 0 0.5em; font-size: 4vw; }
p { min-height: 3em; max-width: 75vw; color: #d4d4d4; }
button { padding: 0.4em 1.1em; border: 0; border-radius: 0.3em; font: inherit; }
button:focus { outline: 4px solid #74b6ff; outline-offset: 5px; }
</style>
</head>
<body>
<h1>YouTube for Tizen</h1>
<p id="status" role="status">Starting the YouTube service…</p>
<button id="retry" type="button" hidden>Try again</button>
<script type="module" src="launcher.js"></script>
</body>
</html>
