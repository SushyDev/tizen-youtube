# Builds the widget and attaches it to the release that triggered it.
#
# The widget is deliberately **unsigned**, and that is what makes it worth
# publishing. A Tizen signature names the television it may be installed on —
# the device id sits inside the distributor certificate, and sets enforce it
# from Tizen 7 — so a signed build installs on its builder's TV and nowhere
# else. Attaching one here would be attaching a file only one person can use.
#
# Tizen Homebrew re-signs whatever it installs with the pair the television
# holds, and a package that was never signed is one of the shapes it accepts.
# So this needs no certificates, no secrets, and produces the one artefact
# anybody can install.
#
# `published` fires once for a release and once for a prerelease, which is why
# it is the only trigger listed: adding `prereleased` as well would run this
# twice for every prerelease.
#
# Exactly one .wgt is attached, and that is load bearing: Tizen Homebrew's
# catalogue resolves a GitHub entry to the first package asset it finds, so a
# release carrying two would install whichever GitHub happens to list first.
#
# One optional variable, under Settings → Secrets and variables → Actions:
#
#   TUBE_ORIGIN   where the TV checks for a newer userscript. Without it the
#                 app still works — both bundles ship inside the package — it
#                 simply never updates itself between releases.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget:
    name: Build the widget
    runs-on: ubuntu-latest

    env:
      TUBE_ORIGIN: ${{ vars.TUBE_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The source of the release being published, rather than whatever the
          # default branch happens to hold at this moment.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The tag names a version and tizen.config.json names one too, and it is
      # the second that ends up inside the package and in latest.json. A release
      # tagged v1.2.0 whose widget reports 1.1.0 is a support question nobody
      # can answer from the outside.
      - name: Check the tag matches the version
        if: github.event_name == 'release'
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./tizen.config.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tizen.config.json, which says $declared."
            echo "Run 'npm run version -- $tagged', commit, and re-tag."
            exit 1
          fi

      - name: Test
        run: npm test

      # `--release` refuses the placeholder origin, and is passed only when a
      # real one is configured. Without TUBE_ORIGIN the placeholder is the
      # honest state of things rather than a mistake to block a release over:
      # the app carries both bundles and works without ever reaching an origin.
      - name: Package
        env:
          STRICT: ${{ (github.event_name == 'release' && !github.event.release.prerelease && vars.TUBE_ORIGIN != '') && '--release' || '' }}
        run: npm run package -- --unsigned $STRICT

      - name: Say the origin is a placeholder
        if: vars.TUBE_ORIGIN == ''
        run: |
          echo "::warning::No TUBE_ORIGIN variable is set, so this build carries the placeholder origin and will never update itself over the air. The bundles inside the package still work."

      # The other half of a release: the userscript bundles the TV downloads
      # after it is installed, with the digests latest.json advertises. Staged
      # only when there is a real origin to serve them from.
      - name: Stage the origin release
        if: vars.TUBE_ORIGIN != ''
        run: npm run release

      - name: Upload the origin release
        if: vars.TUBE_ORIGIN != ''
        uses: actions/upload-artifact@v4
        with:
          name: origin-${{ github.event.release.tag_name || github.ref_name }}
          path: release/origin/
          if-no-files-found: error

      # Named for a person downloading it from the releases page, where
      # "tube.wgt" on its own says nothing about which build it is.
      - name: Name the widget after the version
        id: widget
        run: |
          version="$(node -p "require('./tizen.config.json').version")"
          name="tizen-youtube-${version}.wgt"
          mv release/tube.wgt "release/${name}"
          echo "path=release/${name}" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.widget.outputs.path }}
          fail_on_unmatched_files: true

      # A hand-run build has no release to attach to, so it lands as an
      # artifact instead — which is the point of being able to run it by hand.
      - name: Upload it as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: tizen-youtube-widget
          path: ${{ steps.widget.outputs.path }}
          if-no-files-found: error
