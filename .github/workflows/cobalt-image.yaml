# Builds Cobalt's linux-x64x11 reference port and publishes it for the CI cobalt job.

name: Cobalt image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The youtube/cobalt tag to build
  # Also monthly, so the image picks up updates to its apt packages at the same ref.
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write

env:
  # The set runs Evergreen 5.30.2 on Starboard 16; this is the nearest published line.
  COBALT_REF: ${{ inputs.ref || '25.lts.50' }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out Cobalt
        uses: actions/checkout@v4
        with:
          repository: youtube/cobalt
          ref: ${{ env.COBALT_REF }}
          path: cobalt

      - name: Check out ours
        uses: actions/checkout@v4
        with:
          path: tube

      # A Cobalt build does not fit in the space a hosted runner starts with.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # Bound to a cached host path, since compose otherwise keeps ccache in a Docker volume
      # nothing saves.
      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: cobalt-ccache-${{ env.COBALT_REF }}-${{ github.run_id }}
          restore-keys: cobalt-ccache-${{ env.COBALT_REF }}-

      # The plain cobalt target, because the compose command builds the Evergreen library whose
      # loader is unpublished.
      - name: Build cobalt
        working-directory: cobalt
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          cat > tube-build.sh <<'SH'
          set -e
          gn gen out/linux-x64x11_devel --args='target_platform="linux-x64x11" build_type="devel" symbol_level=0'
          ninja -j "$(nproc)" -C out/linux-x64x11_devel cobalt
          SH
          docker compose build build-base build-linux
          docker compose run --rm --no-deps -w /code -e IS_CI=1 linux-x64x11 sh /code/tube-build.sh
          test -x out/linux-x64x11_devel/cobalt
          test -d out/linux-x64x11_devel/content

      - name: Stage what runs
        run: |
          mkdir -p cobalt/stage
          cp cobalt/out/linux-x64x11_devel/cobalt cobalt/stage/
          cp -r cobalt/out/linux-x64x11_devel/content cobalt/stage/
          find cobalt/out/linux-x64x11_devel -maxdepth 1 -name '*.so*' -exec cp {} cobalt/stage/ \;
          du -sh cobalt/stage

      # GHCR refuses an uppercase repository name, and github.repository is SushyDev/tizen-youtube.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/cobalt" >> "$GITHUB_ENV"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The staged binary and content, plus X11, GL and xvfb for a runner with no display.
      - name: Publish it
        run: |
          cp tube/test/cobalt/Dockerfile cobalt/Dockerfile.tube
          docker build -f cobalt/Dockerfile.tube -t "$IMAGE:$COBALT_REF" -t "$IMAGE:latest" cobalt
          docker push "$IMAGE:$COBALT_REF"
          docker push "$IMAGE:latest"

      - name: Say where it went
        run: echo "::notice::Published $IMAGE:$COBALT_REF — the cobalt job in CI pulls this."
