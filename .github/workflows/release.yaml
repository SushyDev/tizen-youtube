name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget:
    name: Build the widget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          tagged="${tagged%%-*}"
          declared="$(node -p "require('./tizen.config.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tizen.config.json, which says $declared."
            echo "Run 'npm run version:set $tagged', commit, and re-tag."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Audit the widget
        run: npm run audit -- --release

      - name: Name the widgets after the version
        id: widget
        run: |
          version="$(node -p "require('./tizen.config.json').version")"
          mv release/tube-tizen-5.5.wgt "release/tizen-youtube-${version}-tizen-5.5.wgt"
          mv release/tube-tizen-5.0.wgt "release/tizen-youtube-${version}-tizen-5.0.wgt"
          echo "path=release/tizen-youtube-${version}*.wgt" >> "$GITHUB_OUTPUT"

      - name: Keep the service bundles for the runtime matrix
        uses: actions/upload-artifact@v4
        with:
          name: release-service-bundle
          path: |
            service/dist
            service/dist-legacy
          retention-days: 1
          if-no-files-found: error

      - name: Upload it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: tizen-youtube-widget
          path: ${{ steps.widget.outputs.path }}
          if-no-files-found: error

  runtimes:
    name: node ${{ matrix.node }}
    needs: widget
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '4.4.3'     # the legacy bundle alone, up to node 12
            legacy_only: true
          - node: '6.17.1'
            legacy_only: true
          - node: '8.17.0'
            legacy_only: true
          - node: '10.24.1'
            legacy_only: true
          - node: '12.16.3'
          - node: '14.21.3'
          - node: '16.20.2'
          - node: '18.18.2'
          - node: '20.18.1'
          - node: '22.12.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-service-bundle
          path: service

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Load and answer on node ${{ matrix.node }}
        if: ${{ !matrix.legacy_only }}
        run: node service/test/smoke.js

      - name: Load and answer on node ${{ matrix.node }}, legacy
        run: node service/test/smoke.js
        env:
          TUBE_SMOKE_ENTRY: service/dist-legacy/index.js

  # Blocking, because a release reaches strangers.
  browser:
    name: Against real YouTube
    needs: widget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-playwright-report
          path: test/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish the draft
    needs: [widget, runtimes, browser]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tizen-youtube-widget
          path: release

      - name: Open a draft release with it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*.wgt
          fail_on_unmatched_files: true
