# Builds the widget and opens a draft release for the tag that triggered it.
#
#   npm run version:set 1.2.0    # and commit
#   git tag v1.2.0 && git push origin v1.2.0
#
# The widget is unsigned on purpose: a Tizen signature names the television it may be
# installed on, and Tizen Homebrew re-signs whatever it installs.
#
# It must be a *draft* — GitHub refuses asset uploads once a release is published, and
# no workflow event fires when someone saves a draft by hand.
#
# Exactly one .wgt is attached: Tizen Homebrew resolves a GitHub entry to the first
# package asset it finds.
#
# Optional repo variable TUBE_ORIGIN sets where the TV checks for a newer userscript.
# Without it the app works but never updates itself between releases.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget:
    name: Build the widget
    runs-on: ubuntu-latest

    env:
      TUBE_ORIGIN: ${{ vars.TUBE_ORIGIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # tizen.config.json's version is the one that ends up inside the package.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # tizen.config.json holds a bare MAJOR.MINOR.PATCH, so v1.2.0-rc1 compares as 1.2.0.
          tagged="${GITHUB_REF_NAME#v}"
          tagged="${tagged%%-*}"
          declared="$(node -p "require('./tizen.config.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tizen.config.json, which says $declared."
            echo "Run 'npm run version:set $tagged', commit, and re-tag."
            exit 1
          fi

      # Before the tests: the routing suite asks the service for a bundle the build writes.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # `--release` refuses the placeholder origin. A prerelease tag is held to the same
      # standard as a hand-run build.
      - name: Package
        env:
          STRICT: ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && vars.TUBE_ORIGIN != '') && '--release' || '' }}
        run: npm run package -- --unsigned $STRICT

      - name: Say the origin is a placeholder
        if: vars.TUBE_ORIGIN == ''
        run: |
          echo "::warning::No TUBE_ORIGIN variable is set, so this build carries the placeholder origin and will never update itself over the air. The bundles inside the package still work."

      # The userscript bundles the TV downloads after install.
      - name: Stage the origin release
        if: vars.TUBE_ORIGIN != ''
        run: npm run release

      - name: Upload the origin release
        if: vars.TUBE_ORIGIN != ''
        uses: actions/upload-artifact@v4
        with:
          name: origin-${{ github.ref_name }}
          path: release/origin/
          if-no-files-found: error

      # "tube.wgt" on the releases page says nothing about which build it is.
      - name: Name the widget after the version
        id: widget
        run: |
          version="$(node -p "require('./tizen.config.json').version")"
          name="tizen-youtube-${version}.wgt"
          mv release/tube.wgt "release/${name}"
          echo "path=release/${name}" >> "$GITHUB_OUTPUT"

      # Creates the draft, or replaces the asset on the one an earlier run of this tag left.
      - name: Open a draft release with it
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.widget.outputs.path }}
          fail_on_unmatched_files: true

      # A hand-run build off a branch has no tag to draft a release for.
      - name: Upload it as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tizen-youtube-widget
          path: ${{ steps.widget.outputs.path }}
          if-no-files-found: error
