# Everything that can be checked without a television.
#
# The build matters here: ui/build.js refuses CSS a Tizen webview would silently
# drop, and service/build/check-node4.js refuses syntax the oldest Node it targets
# cannot parse.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Versions agree
        run: npm run version:check

      # The placeholder origin is fine here: both bundles ship inside the .wgt.
      # Only `release` and `package --release` refuse it.
      - name: Build
        run: npm run build
        env:
          TUBE_ORIGIN: ${{ vars.TUBE_ORIGIN }}

      - name: Test
        run: npm test
