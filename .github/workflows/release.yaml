name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget:
    name: Build the widget
    runs-on: ubuntu-latest

    env:
      TUBE_ORIGIN: ${{ vars.TUBE_ORIGIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          tagged="${tagged%%-*}"
          declared="$(node -p "require('./tizen.config.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tizen.config.json, which says $declared."
            echo "Run 'npm run version:set $tagged', commit, and re-tag."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        env:
          STRICT: ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && vars.TUBE_ORIGIN != '') && '--release' || '' }}
        run: npm run package -- --unsigned $STRICT

      - name: Say the origin is a placeholder
        if: vars.TUBE_ORIGIN == ''
        run: |
          echo "::warning::No TUBE_ORIGIN variable is set, so this build carries the placeholder origin and will never update itself over the air. The bundles inside the package still work."

      - name: Stage the origin release
        if: vars.TUBE_ORIGIN != ''
        run: npm run release

      - name: Upload the origin release
        if: vars.TUBE_ORIGIN != ''
        uses: actions/upload-artifact@v4
        with:
          name: origin-${{ github.ref_name }}
          path: release/origin/
          if-no-files-found: error

      - name: Name the widget after the version
        id: widget
        run: |
          version="$(node -p "require('./tizen.config.json').version")"
          name="tizen-youtube-${version}.wgt"
          mv release/tube.wgt "release/${name}"
          echo "path=release/${name}" >> "$GITHUB_OUTPUT"

      - name: Open a draft release with it
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.widget.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload it as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tizen-youtube-widget
          path: ${{ steps.widget.outputs.path }}
          if-no-files-found: error
